linkedin:
  # Discovery and JD fetching are deliberately separate: every card found is
  # archived, even when the detail-fetch budget is exhausted. Later runs drain
  # that backlog, so breadth is never lost just to keep a run reasonably short.
  max_new_per_run: 300      # maximum job descriptions fetched per completed run
  initial_hours: 24         # first scan (or scan with no saved state)
  overlap_hours: 1          # overlap incremental scans so boundary jobs are not missed
  max_lookback_hours: 168   # catch up after downtime without an unbounded query
  cooldown_minutes: 90      # frequent pipeline runs reuse the archive inside this window
  max_pages: 10             # LinkedIn returns roughly 10 cards per page
  stop_after_seen_pages: 3  # per query: stop after this many pages with no unseen URLs
  detail_max_age_days: 5    # never spend a JD fetch on a card older than this.
                            # Discovery still archives it; it just stops
                            # competing for a budget it can no longer earn.
  # Run every query twice. Broad protects recall when the recruiter-assigned
  # level is missing/wrong; early-career changes result ordering so eligible
  # jobs buried beyond the broad pagination limit can still surface.
  search_modes:
    - name: broad
      experience: []        # no LinkedIn experience-level filter
    - name: early-career
      experience: [1, 2, 3] # Internship + Entry level + Associate
  queries:
    # Your original n8n filter-sheet rows (verbatim)
    - keywords: Software Engineer
      location: United States
    - keywords: Backend Engineer
      location: United States
    - keywords: Full Stack Engineer
      location: United States
    - keywords: Associate Software Engineer
      location: United States
    - keywords: New Grad Software Engineer
      location: United States
    - keywords: Software Engineer
      location: New York City
    - keywords: Backend Engineer
      location: New York City
    - keywords: Full Stack Engineer
      location: New York City
    # Extra variants for n8n-level breadth (catch alt phrasings: Goldman/MLB-style titles)
    - keywords: Software Engineering
      location: United States
    - keywords: Software Engineering
      location: New York City
    - keywords: Software Developer
      location: United States
    - keywords: Software Engineer New Grad 2026
      location: United States
    - keywords: Software Engineer I
      location: United States
    - keywords: Forward Deployed Engineer
      location: United States
    # Additional phrasing/location lanes. Discovery stays intentionally broad;
    # rank.mjs handles level, sponsorship, and source-quality gates afterward.
    - keywords: Junior Software Engineer
      location: United States
    - keywords: Entry Level Software Developer
      location: United States
    - keywords: Software Engineer Recent Graduate
      location: United States
    - keywords: Software Engineer 2026
      location: United States
    - keywords: Platform Engineer
      location: United States
    - keywords: Systems Software Engineer
      location: United States
    - keywords: AI Software Engineer
      location: United States
    - keywords: Software Engineer
      location: New Jersey
    - keywords: Software Engineer
      location: New York Metropolitan Area
indeed:
  # Indeed can't be scraped from Node (Cloudflare 403s everything), so the scan
  # runs through the Indeed MCP connector inside Claude Code: type /indeed there.
  # The skill applies title_filter + location_filter + company_blocklist (same
  # ones scan.mjs/aggregators.mjs use) before spending any get_job_details
  # calls, then `node indeed.mjs --import` re-enforces them + does the
  # canonical dedup + writes (data/indeed-jds.json + scan-history.tsv).
  max_new_per_run: 50       # cap on get_job_details MCP calls per /indeed run
  days: 30                  # drop results whose "Posted on" is older. Indeed's
                            # search is relevance-ranked, not recency-ranked,
                            # so a tight window throws away most of every page
                            # (aggregators.mjs uses the same 30-day default).
  queries:                  # ~10 results per query, no pagination — breadth = more queries
    - search: Software Engineer
      location: United States
      country_code: US
    - search: Software Engineer New Grad
      location: United States
      country_code: US
    - search: Entry Level Software Engineer
      location: United States
      country_code: US
    - search: Backend Engineer
      location: United States
      country_code: US
    - search: Full Stack Engineer
      location: United States
      country_code: US
    - search: Associate Software Engineer
      location: United States
      country_code: US
    - search: Software Developer
      location: United States
      country_code: US
    - search: Software Engineer
      location: New York, NY
      country_code: US
    - search: Backend Engineer
      location: New York, NY
      country_code: US
    - search: Full Stack Engineer
      location: New York, NY
      country_code: US
    - search: New Grad Software Engineer
      location: New York, NY
      country_code: US
    - search: Software Engineer
      location: remote
      country_code: US
    - search: Backend Engineer
      location: remote
      country_code: US
    # New York state (broader than the NYC-city query above — Indeed treats
    # state vs city location strings as distinct searches, so this surfaces
    # a different top-10 slice, not a subset of the NYC one).
    - search: Software Engineer
      location: New York
      country_code: US
    - search: Backend Engineer
      location: New York
      country_code: US
    - search: Full Stack Engineer
