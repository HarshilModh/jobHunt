# jobhunt config — single source of truth.
# Sections: profile, referral_networks, title_filter, location_filter, linkedin, companies.
# Companies: careers_url drives the provider (greenhouse/ashby/lever/workable/workday).

# AI scoring engine. Two CLIs supported:
#   ai_cli: agy     → Antigravity. Has the newest models (Gemini 3.8 Flash).
#                     Models: "Gemini 3.8 Flash (High|Medium|Low)",
#                             "Gemini 3.1 Pro (High|Low)", "Claude Sonnet 4.6 (Thinking)", ...
#   ai_cli: gemini  → gemini CLI. Models: gemini-3.1-pro-preview, gemini-3-flash-preview,
#                     gemini-2.5-pro, gemini-2.5-flash, ...
# rank.mjs adds a "no tools, use only this prompt" guard so agy returns clean JSON fast (~3s).
ai_cli: agy
ai_model: Gemini 3.8 Flash (High)
ai_retries: 3                 # retry transient CLI/no-JSON failures per 5-job batch
ai_retry_delay_ms: 4000       # synchronous backoff between attempts
ai_new_cap: 200               # max NEW jobs AI-scored per run (newest first; cached ones are free)

# Decision tuning (rank.mjs)
apply_heuristic_floor: 55     # "Apply first" needs AI >= 70 AND heuristic >= this.
                              # Guards against the AI scoring a well-written JD at a
                              # no-name shop 98 while the heuristic sits in the 30s.
                              # Lower to surface more; raise if junk leads the list.
evergreen_days: 60            # ATS postings older than this are treated as evergreen
                              # pipeline reqs and demoted out of "Apply first".
workday_detail_cap: 120       # recent Workday JDs fetched per rank run (newest first)
aggregator_board_detail_cap: 80 # recent Greenhouse/Ashby/Lever boards enriched per rank run

# H-1B sponsorship signal (per company). rank.mjs flags it on the leaderboard:
#   yes → 🛂 sponsors-co   ·   no → 🚫 no-sponsor-co (−30, like a JD no-sponsor)
# Most tracked tech companies sponsor (seeded below). The real value is recording
# `no` for any company a recruiter tells you won't sponsor — it downranks forever.
# Keys are matched against the opening's company name (case-insensitive substring).
# NOTE: LinkedIn jobs from companies NOT listed here fall back to JD-text detection.
sponsors:
  # Known strong H-1B sponsors (seed)
  Google: yes
  Meta: yes
  Amazon: yes
  Apple: yes
  Microsoft: yes
  NVIDIA: yes
  Stripe: yes
  Datadog: yes
  MongoDB: yes
  Anthropic: yes
  OpenAI: yes
  Figma: yes
  Notion: yes
  Cloudflare: yes
  Snowflake: yes
  Databricks: yes
  Airbnb: yes
  Salesforce: yes
  Adobe: yes
  Capital One: yes
  Mastercard: yes
  Plaid: yes
  Robinhood: yes
  Ramp: yes
  Coinbase: yes
  Pinterest: yes
  Lyft: yes
  Palantir: yes
  Roblox: yes
  BlackRock: yes
  Perplexity: yes
  Epic Games: yes
  # Add companies that told you they DON'T sponsor, e.g.:
  # Some Startup: no

# Reposter platforms / gig-work spam / pay-to-train schemes — rank.mjs
# quarantines matches by employer name, feed source, or posting URL. The Indeed
# lane hard-drops these entirely. Substring match, case-insensitive.
company_blocklist:
  - Jobright.ai
  - Yara AI
  - Jobgether
  - RemoteHunter
  - Alignerr
  - BeaconFire
  - Lensa
  - Mindrift
  - Outlier
  - DataAnnotation
  - Crossover
  - SynergisticIT
  - Team Remotely
  - Sundayy
  - Jack & Jill
  - Radley James
  - Hired
  - Crossing Hurdles
  - Staffworx
  - avua
  - Singh Capital Partners
  - Mentor Talent Acquisition
  - Hire Feed
  - Employia
  - Stealth Startup

# Legit W2 staffing firms — open to contract roles through these during the
# initial OPT year (ideally contract-to-hire: STEM OPT extension bars
# third-party client-site placement entirely, even W2). rank.mjs still
# deducts 40 and flags 🚯 so their reposts don't outrank direct postings,
# but the Indeed lane lets them through instead of hard-dropping.
# NOTE: TEKsystems has a reported scheme pressuring OPT hires into pay cuts
# to fund H-1B fees — kept visible by user choice, apply with eyes open.
# Substring match, case-insensitive.
staffing_agencies:
  - Berg Search
  - SearchWorks
  - CyberCoders
  - Jobot
  - Motion Recruitment
  - Robert Half
  - TEKsystems
  - Insight Global
  - Actalent
  - Kforce

# Open-ended discovery beyond the company list (node aggregators.mjs).
# Pulls community job aggregators, applies the SAME title_filter + location_filter,
# dedups against scan-history + pipeline, and feeds rank.mjs like everything else.
aggregators:
  default_days: 30              # only postings from the last N days (--days overrides; 0 = all active)
  drop_citizenship_required: true  # F-1: drop "U.S. Citizenship is Required" listings
  sources:
    - id: simplify-newgrad
      url: https://raw.githubusercontent.com/SimplifyJobs/New-Grad-Positions/dev/.github/scripts/listings.json
      enabled: true
    - id: simplify-intern
      url: https://raw.githubusercontent.com/SimplifyJobs/Summer2026-Internships/dev/.github/scripts/listings.json
      enabled: true
    # speedyapply — actively maintained, direct apply URLs. They split into
    # README (interns) + NEW_GRAD_USA.md (new grad). Both have format: markdown.
    - id: speedyapply-swe-intern
      url: https://raw.githubusercontent.com/speedyapply/2026-SWE-College-Jobs/main/README.md
      format: markdown
      enabled: true
    - id: speedyapply-swe-newgrad
      url: https://raw.githubusercontent.com/speedyapply/2026-SWE-College-Jobs/main/NEW_GRAD_USA.md
      format: markdown
      enabled: true
    - id: speedyapply-ai-intern
      url: https://raw.githubusercontent.com/speedyapply/2026-AI-College-Jobs/main/README.md
      format: markdown
      enabled: true
    - id: speedyapply-ai-newgrad
      url: https://raw.githubusercontent.com/speedyapply/2026-AI-College-Jobs/main/NEW_GRAD_USA.md
      format: markdown
      enabled: true
    # jobright-ai — retained for maximum discovery breadth. rank.mjs identifies
    # these by source/URL, quarantines mirrors, and prefers a direct employer URL.
    - id: jobright-newgrad
      url: https://raw.githubusercontent.com/jobright-ai/2026-Software-Engineer-New-Grad/master/README.md
      format: markdown
      enabled: true
    - id: jobright-intern
      url: https://raw.githubusercontent.com/jobright-ai/2026-Software-Engineer-Internship/master/README.md
      format: markdown
      enabled: true
    # vanshb03 — large community new-grad list (some overlap with simplify/jobright;
    # dedup is by URL, so cross-source repeats of the same job can appear).
    - id: vanshb03-newgrad
      url: https://raw.githubusercontent.com/vanshb03/New-Grad-2026/dev/README.md
      format: markdown
      enabled: true

